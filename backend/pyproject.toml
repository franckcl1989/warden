[project]
name = "warden-backend"
version = "0.1.0"
description = "Warden - small private datacenter hardware monitoring and management platform (API + worker)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "cryptography>=44,<46",
    "httpx[http2]>=0.28,<1",
    "orjson>=3.10,<4",
    "structlog>=24.4,<26",
    "asyncssh>=2.19,<3",
    "pysnmp-lextudio>=6.2,<8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=4,<7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "C4"]
ignore = [
    "S101",   # assert allowed in tests
    "S311",   # non-cryptographic random for non-security purposes
    "ASYNC210", # blocking call checks are explicit by design in sync endpoints
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108"]
"app/generated/*.py" = ["E501"]  # generated data literals; drift-checked by CI

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
files = ["app"]
exclude = ["migrations"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = true

[[tool.mypy.overrides]]
module = ["passlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pysnmp-lextudio ships no type stubs; the SNMP protocol modules wrap its
# surface behind typed app interfaces (M5T1).
module = ["pysnmp.*", "pyasn1.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short"
# Auto mode: the Redfish simulator tests use async fixtures + async tests;
# explicitly-marked async tests elsewhere are unaffected.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a live PostgreSQL 18 instance",
    "unit: pure unit tests without external services",
]
# starlette 1.6 prefers the httpx2 package for TestClient and warns on the httpx
# fallback; httpx2 is not a lockfile dependency (M0T3: no new dependencies).
# pysnmp-lextudio is pinned in the lockfile and emits a deprecation warning at
# import (it is the only snmp implementation allowed by the lockfile, M5T1);
# the warning is noise, not a code problem.
#
# M6T2b residual GC noise: pysnmp-lextudio on the Windows proactor leaves a
# bounded transport/socket/file-litter family that cannot be closed
# deterministically from platform code (the fire-and-forget close deadlock is
# fixed at every sender site, but engines abandoned on error paths and
# pysnmp's engine-boots persistence leak stay open inside reference cycles).
# Their __del__ ResourceWarnings fire at an ARBITRARY later cyclic GC and
# fail whichever test is running then (observed on test_m1_gate/test_pools/
# test_maintenance). Every entry below is MESSAGE-scoped to the exact
# observed pysnmp/proactor garbage-object reprs (never a category-wide
# ignore), so functional warnings of the same categories in platform code
# still escalate. The __del__ warnings are also the direct cause of the
# derived PytestUnraisableExceptionWarning forms, so scoping the root text
# suppresses both without touching the pytest category.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The 'pysnmp-lextudio' package is deprecated.*:RuntimeWarning",
    "ignore:unclosed transport <_ProactorDatagramTransport .*:ResourceWarning",
    "ignore:unclosed <socket.socket fd=.*:ResourceWarning",
    "ignore:unclosed file <_io.TextIOWrapper name='.*__pysnmp.*:ResourceWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
