name: CI

on:
  push:
    branches:
      - 0.1.0
      - main
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        # All backend tooling (ruff/mypy/pytest/codegen) must run from
        # backend/ so it picks up backend/pyproject.toml and resolves
        # app/ and tests/ paths. uv discovers the project from cwd, so
        # no --project flag is needed here.
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: warden
          POSTGRES_DB: warden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check app tests
      - name: Typecheck
        run: uv run mypy app
      - name: Codegen
        run: uv run python -m app.tools.codegen
      - name: Generated drift check
        # codegen emits backend/app/generated and frontend/src/api/generated
        # (contracts.ts). openapi.ts drift is checked from M2 on; openapi-typescript
        # requires the backend openapi export (backend/openapi.gen.json) first.
        working-directory: .
        run: git diff --exit-code -- backend/app/generated frontend/src/api/generated
      - name: Tests
        env:
          WARDEN_TEST_POSTGRES_DSN: postgresql://warden:warden@localhost:5432/warden_test
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
      # test:e2e stays out of default CI until the M2 gate: Playwright browsers
      # are heavy and e2e needs a running dev/backend stack. Run locally via
      # `npx playwright install chromium` + `npm run test:e2e`.

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design validation
        run: pwsh -File scripts/check-design.ps1
      - name: Hardware certification matrix
        # The matrix is committed; the checker validates coverage, ownership
        # and schema fields against the contracts. The strict release gate
        # (-RequireReleaseReady) intentionally stays failing until real
        # hardware evidence exists (docs/HARDWARE_CERTIFICATION.md).
        run: pwsh -File scripts/check-hardware-certification.ps1 -MatrixPath tests/hardware-certification/matrix.json
      - name: Hardware matrix drift check
        # Regenerate with the fixed timestamp and fail if the committed
        # matrix differs from what the contracts imply. The committed matrix
        # must be regenerated with the same timestamp (make matrix).
        run: |
          pwsh -File scripts/generate-hardware-matrix.ps1 -GeneratedAt 2026-09-01T00:00:00Z
          git diff --exit-code -- tests/hardware-certification/matrix.json || \
            { echo "Hardware certification matrix drifted from contracts; run 'make matrix' and commit the regenerated matrix."; exit 1; }
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks detect --no-banner --redact --source . --config .gitleaks.toml
