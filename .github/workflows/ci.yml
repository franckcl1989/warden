name: CI

on:
  push:
    branches:
      - 0.1.0
      - main
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: warden
          POSTGRES_DB: warden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --project backend --all-extras
      - name: Lint
        run: uv run --project backend ruff check app tests
      - name: Typecheck
        run: uv run --project backend mypy app
      - name: Codegen
        working-directory: backend
        run: uv run --project backend python -m app.tools.codegen
      - name: Generated backend drift check
        # frontend/src/api/generated drift joins this check after M0T5 creates the frontend.
        run: git diff --exit-code -- backend/app/generated
      - name: Tests
        env:
          WARDEN_TEST_POSTGRES_DSN: postgresql://warden:warden@localhost:5432/warden_test
        run: uv run --project backend pytest -q

  frontend:
    if: ${{ false }} # enable after M0T5 creates frontend/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm run test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-powershell@v2
      - name: Design validation
        run: pwsh -File scripts/check-design.ps1
      - name: Hardware certification matrix
        run: |
          if [ ! -f tests/hardware-certification/matrix.json ]; then
            echo "matrix not generated yet (M0T6)"
            exit 0
          fi
          pwsh -File scripts/check-hardware-certification.ps1 -MatrixPath tests/hardware-certification/matrix.json
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks detect --no-banner --redact --source . --config .gitleaks.toml
