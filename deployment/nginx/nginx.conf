# Warden Nginx 主配置（唯一 Web 入口；ARCHITECTURE §3.1、SECURITY §10）
# 服务器块在 conf.d/（模板 envsubst 生成）；不直接暴露 PostgreSQL 或文件目录。

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    # 连接数上限为部署参数，非产品容量承诺（ADR-027），M6 按验收负载调整
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    # 上传大小由应用层配额控制（WARDEN_MAX_*_BYTES），Nginx 不做额外限制
    client_max_body_size 0;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_request_id"';
    access_log /var/log/nginx/access.log main;

    include /etc/nginx/conf.d/*.conf;
}
